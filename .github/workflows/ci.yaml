name: CI

on:
  push:
    branches: [master, development, 'development-*']
  pull_request:

env:
  # cache affixes and folders
  PNPM_CACHE_AFFIX: pnpm
  PNPM_CACHE_FOLDER: ~/.pnpm-store
  PLAYWRIGHT_CACHE_AFFIX: pw
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
  SENTRY_TELEMETRY_DISABLE: true
  STORYBOOK_DISABLE_TELEMETRY: 1
  OPENSPEC_TELEMETRY: 0

jobs:
  # Job to read Node version from .nvmrc
  read-nvmrc:
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .nvmrc
          sparse-checkout-cone-mode: false

      - name: Read .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

  Build-And-Test:
    needs: read-nvmrc
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: ['${{ needs.read-nvmrc.outputs.node-version }}', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install package manager
        uses: pnpm/action-setup@v4

      # Configure pnpm store directory BEFORE setup-node tries to cache it
      - name: Setup pnpm config
        run: pnpm config set store-dir ${{ env.PNPM_CACHE_FOLDER }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Additional Cache
        uses: actions/cache@v5
        id: additional_cache
        with:
          path: |
            ${{ env.PNPM_CACHE_FOLDER }}
            ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-${{ env.PNPM_CACHE_AFFIX }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/.browserslistrc') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.PNPM_CACHE_AFFIX }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ env.PNPM_CACHE_AFFIX }}-

      - name: Install dependencies
        run: |
          echo "Node version: $(node --version)"
          echo "PNPM version: $(pnpm --version)"
          pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:ci

      - name: Lint
        run: pnpm lint

      - name: OpenSpec
        run: pnpm openspec:validate

      - name: Build
        run: pnpm build

      - name: Test
        env:
          TEST_SERIAL_TIMEOUT: ${{ vars.TEST_SERIAL_TIMEOUT }}
        run: |
          pnpm test:ci

  Sitemap-Check:
    needs: read-nvmrc
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install package manager
        uses: pnpm/action-setup@v4

      - name: Setup pnpm config
        run: pnpm config set store-dir ${{ env.PNPM_CACHE_FOLDER }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.read-nvmrc.outputs.node-version }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_CACHE_FOLDER }}
          key: ${{ runner.os }}-${{ env.PNPM_CACHE_AFFIX }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.PNPM_CACHE_AFFIX }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # scripts/update-sitemap.ts imports app/utils/programs.ts, which imports the built @explorer/decoder-mango.
      - name: Build workspace packages
        run: pnpm build:packages

      - name: Generate sitemap
        run: pnpm exec tsx scripts/update-sitemap.ts

      - name: Check for sitemap drift
        run: git diff --exit-code public/sitemap.xml public/default-sitemap.xml public/accounts-sitemap.xml

  Storybook-Smoke-Tests:
    needs: read-nvmrc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    strategy:
      matrix:
        node-version: ['${{ needs.read-nvmrc.outputs.node-version }}', '24.x']

    # The browser-mode sweep has repeatedly died on a full root partition ("No space left on device").
    # Browsers and the Vite dep-optimize cache live on the runner's ~65 GB /mnt scratch disk
    # (PLAYWRIGHT_BROWSERS_PATH / VITE_CACHE_PATH); the pnpm store stays on / so node_modules keeps hardlinking,
    # with `pnpm store prune` stopping the restore-keys snowball. Job-own cache affixes keep old archives out.
    env:
      PNPM_CACHE_AFFIX: pnpm-sb
      PLAYWRIGHT_CACHE_AFFIX: pw-mnt
      PLAYWRIGHT_BROWSERS_PATH: /mnt/cache/ms-playwright
      VITE_CACHE_PATH: /mnt/cache/vite

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare cache dirs on the scratch disk
        run: |
          sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" "$VITE_CACHE_PATH"
          sudo chown -R "$(id -u):$(id -g)" "$PLAYWRIGHT_BROWSERS_PATH" "$VITE_CACHE_PATH"

      - name: Install package manager
        uses: pnpm/action-setup@v4

      - name: Setup pnpm config
        run: pnpm config set store-dir ${{ env.PNPM_CACHE_FOLDER }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_CACHE_FOLDER }}
          key: ${{ runner.os }}-${{ env.PNPM_CACHE_AFFIX }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.PNPM_CACHE_AFFIX }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright_cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ env.PLAYWRIGHT_CACHE_AFFIX }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.PLAYWRIGHT_CACHE_AFFIX }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drops store packages no longer referenced by the lockfile so the restored-then-saved cache stays bounded.
      - name: Prune pnpm store
        run: pnpm store prune

      - name: Install Playwright browsers
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.playwright_cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run Storybook smoke tests
        env:
          STORYBOOK_DISABLE_TELEMETRY: ${{ env.STORYBOOK_DISABLE_TELEMETRY }}
        run: pnpm test:sb

  Storybook-Visual-Regression:
    needs: read-nvmrc
    # Master-based PRs only: baselines are captured from master (storybook-vr-baseline.yaml), so a
    # development-targeted PR would silently diff against the wrong branch.
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory by decision: drift shows as a red check but never blocks the PR.
    continue-on-error: true

    # pnpm-sb / pw-mnt affixes shared with Storybook-Smoke-Tests on purpose — identical install and browser
    # set; separate affixes would duplicate multi-GB entries in the 10GB cache pool.
    env:
      PNPM_CACHE_AFFIX: pnpm-sb
      PLAYWRIGHT_CACHE_AFFIX: pw-mnt
      PLAYWRIGHT_BROWSERS_PATH: /mnt/cache/ms-playwright
      SBVR_BASELINE_DIR: /mnt/sbvr/baseline
      SBVR_CURRENT_DIR: /mnt/sbvr/current
      SBVR_DIFF_DIR: /mnt/sbvr/diff
      # invoked via node, not `pnpm exec`: the repo's .pnpmfile.cjs prints a banner to stdout that would
      # corrupt the cache-key command substitution and the diff step-summary markdown.
      SBVR_CLI: node packages/story-automation/dist/cli.js

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare cache dirs on the scratch disk
        run: |
          sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" "$SBVR_BASELINE_DIR" "$SBVR_CURRENT_DIR" "$SBVR_DIFF_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$PLAYWRIGHT_BROWSERS_PATH" /mnt/sbvr

      - name: Install package manager
        uses: pnpm/action-setup@v4

      - name: Setup pnpm config
        run: pnpm config set store-dir ${{ env.PNPM_CACHE_FOLDER }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.read-nvmrc.outputs.node-version }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_CACHE_FOLDER }}
          key: ${{ runner.os }}-${{ env.PNPM_CACHE_AFFIX }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.PNPM_CACHE_AFFIX }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright_cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ env.PLAYWRIGHT_CACHE_AFFIX }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.PLAYWRIGHT_CACHE_AFFIX }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prune pnpm store
        run: pnpm store prune

      - name: Install Playwright browsers
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.playwright_cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # ImageOS (Ubuntu major = font stack) and the chromium build revision are the two environment inputs
      # that change rendered pixels; ImageVersion is deliberately excluded (weekly staggered rollouts flap keys).
      # merge_base = the base-branch head the PR is measured against (payload base.sha, no deep clone needed).
      # Exact-SHA baseline hits are rare anyway (dispatch-only baselines) — the prefix restore-key is the real path.
      - name: Compute baseline cache key
        id: vr_key
        run: |
          pnpm --filter @explorer/story-automation build
          echo "image=$ImageOS" >> $GITHUB_OUTPUT
          echo "chromium=$($SBVR_CLI chromium-revision)" >> $GITHUB_OUTPUT
          echo "merge_base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT

      # Restore-only: PR runs must never save branch-scoped baseline copies into the shared cache pool.
      - name: Restore baseline
        uses: actions/cache/restore@v5
        id: baseline_restore
        with:
          path: ${{ env.SBVR_BASELINE_DIR }}
          key: sbvr-baseline-v1-${{ steps.vr_key.outputs.image }}-cr${{ steps.vr_key.outputs.chromium }}-${{ steps.vr_key.outputs.merge_base }}
          restore-keys: |
            sbvr-baseline-v1-${{ steps.vr_key.outputs.image }}-cr${{ steps.vr_key.outputs.chromium }}-

      - name: Note missing baseline
        if: steps.baseline_restore.outputs.cache-matched-key == ''
        run: |
          {
            echo "### Storybook visual regression"
            echo ""
            echo "Skipped: no baseline cached for \`sbvr-baseline-v1-${{ steps.vr_key.outputs.image }}-cr${{ steps.vr_key.outputs.chromium }}-\`."
            echo "Dispatch the **Storybook VR Baseline** workflow on \`master\` to build one."
          } >> $GITHUB_STEP_SUMMARY

      - name: Build workspace packages
        if: steps.baseline_restore.outputs.cache-matched-key != ''
        run: pnpm build:packages

      - name: Build Storybook
        if: steps.baseline_restore.outputs.cache-matched-key != ''
        run: pnpm build-sb

      - name: Capture PR screenshots
        if: steps.baseline_restore.outputs.cache-matched-key != ''
        run: $SBVR_CLI capture --static-dir storybook-static --out "$SBVR_CURRENT_DIR" --parallel 6

      - name: Pixel diff against baseline
        id: vr_diff
        if: steps.baseline_restore.outputs.cache-matched-key != ''
        run: |
          $SBVR_CLI diff \
            --baseline "$SBVR_BASELINE_DIR" \
            --current "$SBVR_CURRENT_DIR" \
            --triplets "$SBVR_DIFF_DIR" \
            --allowlist packages/story-automation/allowlists/flaky.json \
            --allowlist packages/story-automation/allowlists/intentional.json \
            --merge-base "${{ steps.vr_key.outputs.merge_base }}" \
            --summary-md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drift triplets
        if: failure() && steps.vr_diff.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: sbvr-diff-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ env.SBVR_DIFF_DIR }}
          retention-days: 14
          if-no-files-found: ignore
